services:
  kudu:
    user: root
    cap_add:
      - SYS_TIME
    image: apache/kudu:1.17.0
    ulimits:
      core: 0
    networks:
      - impala
    command: kudu master run --fs_wal_dir=/var/lib/kudu/master --fs_data_dirs=/var/lib/kudu/master --log_dir=/tmp -cloud_metadata_server_request_timeout_ms=100
    volumes:
      - kudu-master:/var/lib/kudu/master
    healthcheck:
      interval: 5s
      retries: 60
      test:
        - CMD-SHELL
        - bash -c 'true > /dev/tcp/127.0.0.1/7051'

  kudu-tserver:
    user: root
    cap_add:
      - SYS_TIME
    image: apache/kudu:1.17.0
    ulimits:
      core: 0
    networks:
      - impala
    command: kudu tserver run --fs_wal_dir=/var/lib/kudu/tserver --fs_data_dirs=/var/lib/kudu/tserver --log_dir=/tmp --tserver_master_addrs=kudu -cloud_metadata_server_request_timeout_ms=100
    volumes:
      - kudu-tserver:/var/lib/kudu/tserver
    healthcheck:
      interval: 5s
      retries: 60
      test:
        - CMD-SHELL
        - bash -c 'true > /dev/tcp/127.0.0.1/7050'

  impala-hive-metastore:
    image: apache/impala:4.5.0-impala_quickstart_hms
    ulimits:
      core: 0
    container_name: impala-hive-metastore
    command: hms
    volumes:
      # Volume used to store Apache Derby database.
      - impala:/var/lib/hive
      # Warehouse directory. HMS does file operations so needs access to the
      # shared volume.
      - impala:/user/hive/warehouse
      - ./docker/impala/conf:/opt/hive/conf:ro
    healthcheck:
      interval: 3s
      retries: 20
      test:
        - CMD-SHELL
        - bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/9083; exit $$?;'
        - bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/impala-hive-metastore/9083; exit $$?;'
        - bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/impala-hive-metastore.impala/9083; exit $$?;'
    networks:
      impala:
        aliases:
          - impala-hive-metastore
          - impala-hive-metastore.impala

  statestored:
    image: apache/impala:4.5.0-statestored
    ulimits:
      core: 0
    ports:
      - 25010:25010 # Web debug UI
    command:
      - -redirect_stdout_stderr=false
      - -logtostderr
      - -v=1
    volumes:
      - ./docker/impala/conf:/opt/impala/conf:ro
    healthcheck:
      interval: 3s
      retries: 20
      test:
        - CMD-SHELL
        - bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/25010; exit $$?;'
    networks:
      - impala

  catalogd:
    image: apache/impala:4.5.0-catalogd
    ulimits:
      core: 0
    depends_on:
      impala-hive-metastore:
        condition: service_healthy
      statestored:
        condition: service_healthy
    ports:
      - 25020:25020 # Web debug UI
    command:
      - -redirect_stdout_stderr=false
      - -logtostderr
      - -v=1
      - -hms_event_polling_interval_s=1
      - -invalidate_tables_timeout_s=999999
    volumes:
      # Warehouse directory. Catalog does file operations so needs access to the
      # shared volume.
      - impala:/user/hive/warehouse
      - ./docker/impala/conf:/opt/impala/conf:ro
    healthcheck:
      interval: 3s
      retries: 20
      test:
        - CMD-SHELL
        - bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/25020; exit $$?;'
    networks:
      - impala

  impala:
    image: apache/impala:4.5.0-impalad_coord_exec
    ulimits:
      core: 0
    depends_on:
      statestored:
        condition: service_healthy
      catalogd:
        condition: service_healthy
      kudu:
        condition: service_healthy
      kudu-tserver:
        condition: service_healthy
    ports:
      - 21050:21050 # HS2 endpoint
      - 25000:25000 # Web UI
      - 21000:21000 # Impala shell port
    healthcheck:
      interval: 5s
      retries: 30
      timeout: 10s
      start_period: 30s
      test:
        - CMD-SHELL
        - bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/21050; exit $$?;'
    command:
      - -v=1
      - -redirect_stdout_stderr=false
      - -logtostderr
      - -kudu_master_hosts=kudu:7051
      - -mt_dop_auto_fallback=true
      - -default_query_options=mt_dop=4,default_file_format=parquet,default_transactional_type=insert_only
      - -mem_limit=32gb
      - -statestore_subscriber_timeout_seconds=60
    environment:
      # Keep the Java heap small to preserve memory for query execution.
      JAVA_TOOL_OPTIONS: -Xmx1g
    volumes:
      - impala:/user/hive/warehouse
      - ./docker/impala/conf:/opt/impala/conf:ro
    networks:
      - impala

networks:
  impala:
    name: impala-network
  
volumes:
  impala:
  kudu-master:
  kudu-tserver:

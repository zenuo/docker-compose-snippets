[project]
name = "impala-in-docker"
version = "0.1.0"
description = "Python Impala client for the local Impala Docker cluster"
requires-python = ">=3.14"
dependencies = [
    "impyla (>=0.24.0,<0.25.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
